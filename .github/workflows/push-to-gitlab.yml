name: Force push main and tags to GitLab

on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: gitlab-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-to-gitlab:
    if: github.repository == 'dpolivaev/spec-loop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force push main to GitLab
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GITLAB_REPO_URL: ${{ vars.GITLAB_REPO_URL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

          AUTH_URL=$(echo "$GITLAB_REPO_URL" | sed "s#https://#https://oauth2:${GITLAB_TOKEN}@#")
          git remote add gitlab "$AUTH_URL"

          git push gitlab HEAD:refs/heads/main --force

      - name: Push tag to GitLab
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITLAB_REPO_URL: ${{ vars.GITLAB_REPO_URL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

          AUTH_URL=$(echo "$GITLAB_REPO_URL" | sed "s#https://#https://oauth2:${GITLAB_TOKEN}@#")
          git remote add gitlab "$AUTH_URL"

          git push gitlab HEAD:refs/tags/${TAG}
